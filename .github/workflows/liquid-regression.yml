name: Liquid Regression Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Setup and Full Stage Verification
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Run deterministic setup and full verification suite
        run: ./bin/setup && ./bin/check all

  pr-snippet-check:
    name: PR Snippet Regression Check
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout full PR history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"

      - name: Cache Liquid engine gem bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/liquid-regression-finder
          key: ${{ runner.os }}-lrf-gems-${{ hashFiles('.ruby-version', 'engine/Gemfile.lock') }}

      - name: Pack and install CLI and initialize engine cache
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/lrf-pack"
          TARBALL_NAME="$(npm pack --pack-destination "$RUNNER_TEMP/lrf-pack" | tail -n 1)"
          TARBALL="$RUNNER_TEMP/lrf-pack/$TARBALL_NAME"
          npm install --no-save --no-audit --no-fund "$TARBALL"
          npx --no-install liquid-regression-finder setup

      - name: Run CLI snippet regression check
        id: snippet-check
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          OUT_FILE="$RUNNER_TEMP/lrf-check-stdout.txt"
          ERR_FILE="$RUNNER_TEMP/lrf-check-stderr.txt"

          set +e
          npx --no-install liquid-regression-finder check \
            --base-ref "$BASE_SHA" \
            --head-ref "$HEAD_SHA" \
            --search-pairs 256 \
            --shrink-pairs 128 \
            --replay-out .liquid-regression/result.json \
            >"$OUT_FILE" 2>"$ERR_FILE"
          RC=$?
          set -e

          if [ -s "$OUT_FILE" ]; then
            cat "$OUT_FILE"
          fi
          if [ -s "$ERR_FILE" ]; then
            cat "$ERR_FILE" >&2
          fi

          HAS_ARTIFACT="false"
          if [ "$RC" -eq 0 ]; then
            {
              echo "### Liquid Regression Check: Passed (\`no_difference_found\`)"
              echo ""
              echo "- **Base**: \`${BASE_SHA}\`"
              echo "- **Head**: \`${HEAD_SHA}\`"
              echo "- **Budget**: \`search_pairs=256\`, \`shrink_pairs=128\`"
              echo "- **Result**: No sale-badge difference found within search budget."
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ "$RC" -eq 1 ]; then
            HAS_ARTIFACT="true"
            mkdir -p .liquid-regression
            {
              echo "Status: difference_found (exit 1)"
              echo "Base: ${BASE_SHA}"
              echo "Head: ${HEAD_SHA}"
              echo "Budget: search_pairs=256, shrink_pairs=128"
              echo ""
              cat "$OUT_FILE"
            } > .liquid-regression/summary.txt
            {
              echo "### Liquid Regression Check: Regression Found (exit \`1\`)"
              echo ""
              echo "- **Base**: \`${BASE_SHA}\`"
              echo "- **Head**: \`${HEAD_SHA}\`"
              echo "- **Budget**: \`search_pairs=256\`, \`shrink_pairs=128\`"
              echo "- **Artifacts**: \`.liquid-regression/result.json\` and \`.liquid-regression/summary.txt\`"
              echo ""
              echo '```text'
              cat "$OUT_FILE"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            HAS_ARTIFACT="true"
            mkdir -p .liquid-regression
            {
              echo "Status: error (exit ${RC})"
              echo "Base: ${BASE_SHA}"
              echo "Head: ${HEAD_SHA}"
              echo "Budget: search_pairs=256, shrink_pairs=128"
              echo ""
              if [ -s "$ERR_FILE" ]; then
                cat "$ERR_FILE"
              fi
              if [ -s "$OUT_FILE" ]; then
                cat "$OUT_FILE"
              fi
            } > .liquid-regression/summary.txt
            {
              echo "### Liquid Regression Check: Failed (exit \`${RC}\`)"
              echo ""
              echo "- **Base**: \`${BASE_SHA}\`"
              echo "- **Head**: \`${HEAD_SHA}\`"
              echo "- **Summary artifact**: \`.liquid-regression/summary.txt\`"
              echo ""
              echo '```text'
              if [ -s "$ERR_FILE" ]; then
                cat "$ERR_FILE"
              fi
              if [ -s "$OUT_FILE" ]; then
                cat "$OUT_FILE"
              fi
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "has_artifact=${HAS_ARTIFACT}" >> "$GITHUB_OUTPUT"
          exit "$RC"

      - name: Upload regression replay and summary artifacts
        if: always() && steps.snippet-check.outputs.has_artifact == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: liquid-regression-artifacts
          path: |
            .liquid-regression/result.json
            .liquid-regression/summary.txt
          if-no-files-found: ignore
          retention-days: 14
