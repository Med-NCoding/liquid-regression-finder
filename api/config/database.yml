default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 10000

development:
  <<: *default
  database: <%= ENV.fetch("LIQUID_REGRESSION_DB_PATH") { "storage/development.sqlite3" } %>

test:
  <<: *default
  database: <%= ENV.fetch("LIQUID_REGRESSION_TEST_DB_PATH") { "storage/test.sqlite3" } %>

production:
  <<: *default
  database: <%= ENV.fetch("LIQUID_REGRESSION_DB_PATH") { "storage/production.sqlite3" } %>
